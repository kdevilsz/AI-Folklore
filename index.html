<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LoreBridge — Preserving Assamese folktales, proverbs, and oral traditions through AI-powered cultural heritage technology.">
    <title>LoreBridge — Echoes of the Brahmaputra</title>
    <link rel="stylesheet" href="index.css?v=6">
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
    <div class="grain-overlay"></div>
    <div class="ambient-glow"></div>

    <nav id="main-nav">
        <div class="nav-brand-container">
            <span class="nav-brand" onclick="window.location.hash='#home'" style="cursor:pointer;">LoreBridge</span>
        </div>
        <div class="nav-links" id="nav-links">
            <a href="#home">Home</a>
            <a href="#folktales">Folktales</a>
            <a href="#proverbs">Proverbs</a>
            <a href="#graph">Lore Web</a>
            <a href="#chat">Oracle</a>
            <a href="#about">About</a>
            <a href="#share">Share</a>
            <a href="#admin">Admin</a>
            <a href="#quality">Quality</a>
            <a href="#eval">Eval</a>
            <a href="#ingest">Ingest</a>
        </div>
        <div class="nav-actions">
            <div class="nav-search">
                <span style="margin-right:5px;">🔍</span>
                <input type="text" id="global-search-input" placeholder="Search..." autocomplete="off">
            </div>
            <button id="lang-toggle" onclick="window.toggleLanguage()" title="Switch Language" class="nav-btn-lang">EN</button>
            <button id="theme-toggle" class="btn-icon" title="Toggle Theme">🌓</button>
            <button id="nav-toggle" class="nav-toggle-btn" aria-label="Toggle Navigation" title="Menu">☰</button>
        </div>
    </nav>

    <div id="search-overlay" class="search-overlay">
        <span class="search-close" id="search-close">&times;</span>
        <h2 style="color:var(--primary);">Global Search</h2>
        <div id="search-results" class="search-results-container"></div>
    </div>

    <div id="app"></div>

    <!-- Single bundled script — no ES modules, no import/export, works everywhere -->
    <script src="js/bundle.js?v=6"></script>
</body>
</html>
