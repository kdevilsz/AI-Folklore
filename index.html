<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LoreBridge — Preserving Assamese folktales, proverbs, and oral traditions through AI-powered cultural heritage technology.">
    <title>LoreBridge — Echoes of the Brahmaputra</title>
    <link rel="stylesheet" href="index.css?v=6">
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
    <div class="grain-overlay"></div>
    <div class="ambient-glow"></div>

    <nav>
        <span class="nav-brand">LoreBridge</span>
        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#folktales">Folktales</a>
            <a href="#proverbs">Proverbs</a>
            <a href="#graph">Lore Web</a>

    <div id="search-overlay" class="search-overlay">
        <span class="search-close" id="search-close">&times;</span>

        <div id="search-results" class="search-results-container"></div>
    </div>

    <!-- Single bundled script — no ES modules, no import/export, works everywhere -->
    <script src="js/bundle.js?v=6"></script>
